name: Fuentes

on:
  push:
    branches: [main]
    paths: ["plataformas/**", "plantilla/**", "stack.md", "fuentes/README.md", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["plataformas/**", "plantilla/**", "stack.md", "fuentes/README.md", "scripts/**", ".github/workflows/**"]

jobs:
  citas:
    runs-on: ubuntu-latest
    # ADR-0108: each part of a source rules in one section, as plataformas/README.md says.
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/verificar.py --canone
