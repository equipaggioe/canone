name: Infra

on:
  push:
    branches: [main]
    paths: ["plantilla/infra/**", "plantilla/receiver/**", "plantilla/server/**", "plantilla/scripts/java.py",
      "scripts/infra/**", "fuentes/iana/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["plantilla/infra/**", "plantilla/receiver/**", "plantilla/server/**", "plantilla/scripts/java.py",
      "scripts/infra/**", "fuentes/iana/**", ".github/workflows/infra.yml"]

jobs:
  exposure:
    runs-on: ubuntu-latest
    # The systemd of Debian 13, where the units run.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends systemd
      - run: |
          for unit in plantilla/infra/*.service; do
            systemd-analyze security --offline=yes --threshold=20 "$unit"
          done

  # ADR-0149: the units that run the app let numpy import. systemd-run needs the runner's systemd,
  # not a container.
  seccomp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo sh scripts/infra/seccomp.sh "$PWD"

  # java.md: java.py builds a piece with the JDK of the CI, and the JRE of Debian 13 runs it.
  java-build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: >-
          apt-get update && apt-get install --yes --no-install-recommends
          openjdk-21-jre-headless python3 ca-certificates
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: sh scripts/infra/java-build.sh "$PWD"

  caddy:
    runs-on: ubuntu-latest
    # The Caddy that packages.py installs on the server, from its repository.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends curl python3
      - run: python3 plantilla/infra/packages.py
      - run: sh scripts/infra/caddy.sh "$PWD"

  authorize:
    runs-on: ubuntu-latest
    # The OpenSSH and the Python of Debian 13, as root.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends openssh-client python3
      - run: sh scripts/infra/authorize.sh "$PWD"

  sshd:
    runs-on: ubuntu-latest
    # The OpenSSH of Debian 13, which reads the receiver's Match block.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends openssh-server
      - run: |
          sed s/PRODUCTO/app/g plantilla/infra/sshd.conf > /etc/ssh/sshd_config.d/00-app.conf
          sed s/PRODUCTO/app/g plantilla/infra/sshd-receiver.conf > /etc/ssh/sshd_config.d/app-receiver.conf
          mkdir -p /run/sshd
          ssh-keygen -A
          sshd -t
      # A provider's file that allows passwords does not win over the template.
      - run: |
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' > /etc/ssh/sshd_config.d/50-cloud-init.conf
          sshd -T > "$RUNNER_TEMP/sshd.txt"
          grep -x "permitrootlogin no" "$RUNNER_TEMP/sshd.txt"
          grep -x "passwordauthentication no" "$RUNNER_TEMP/sshd.txt"
          grep -x "kbdinteractiveauthentication no" "$RUNNER_TEMP/sshd.txt"
          # The keys in files of root, no forwarding but to a socket, and idle sessions closed.
          grep -x "authorizedkeysfile /etc/ssh/authorized_keys/%u" "$RUNNER_TEMP/sshd.txt"
          grep -x "allowtcpforwarding local" "$RUNNER_TEMP/sshd.txt"
          grep -x "allowagentforwarding no" "$RUNNER_TEMP/sshd.txt"
          grep -x "x11forwarding no" "$RUNNER_TEMP/sshd.txt"
          grep -x "allowstreamlocalforwarding local" "$RUNNER_TEMP/sshd.txt"
          grep -x "channeltimeout session=30m" "$RUNNER_TEMP/sshd.txt"
          grep -x "unusedconnectiontimeout 1800" "$RUNNER_TEMP/sshd.txt"
          # The receiver: its key, its command, its tunnel, and its session not closed.
          sshd -T -C user=app-receiver,host=receiver,addr=192.0.2.1 > "$RUNNER_TEMP/receiver.txt"
          grep -x "authorizedkeysfile /etc/app/receivers" "$RUNNER_TEMP/receiver.txt"
          grep -x "forcecommand /usr/local/lib/app/backup-request" "$RUNNER_TEMP/receiver.txt"
          grep -x "allowtcpforwarding remote" "$RUNNER_TEMP/receiver.txt"
          grep -x "permitlisten 127.0.0.1:8001" "$RUNNER_TEMP/receiver.txt"
          grep -x "allowstreamlocalforwarding no" "$RUNNER_TEMP/receiver.txt"
          grep -x "channeltimeout session=0" "$RUNNER_TEMP/receiver.txt"

  nftables:
    runs-on: ubuntu-latest
    # The nftables of Debian 13, probed from another network namespace.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends nftables iproute2 python3
      - run: sh scripts/infra/nftables.sh plantilla/infra/nftables.conf
      - run: sh scripts/infra/nftables.sh plantilla/infra/nftables.conf plantilla/infra/turn.nft

  coturn:
    runs-on: ubuntu-latest
    # The coturn of Debian 13, relaying from another network namespace.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - run: >-
          apt-get update && apt-get install --yes --no-install-recommends
          coturn iproute2 nftables procps python3
      - run: sh scripts/infra/coturn.sh plantilla/infra/turnserver.conf
      - run: sh scripts/infra/coturn-nat.sh plantilla/infra/turnserver.conf

  logs:
    runs-on: ubuntu-latest
    # The uploader of Debian 13, sending through the tunnel from another network namespace.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - run: >-
          apt-get update && apt-get install --yes --no-install-recommends
          systemd-journal-remote wireguard-tools iproute2
      - run: sh scripts/infra/logs.sh plantilla/infra/logs.conf plantilla/infra/journal-upload.conf

  uv:
    runs-on: ubuntu-latest
    # The Python of Debian 13 runs uv.py, which downloads uv from GitHub.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl python3
      - run: sh scripts/infra/uv.sh "$PWD"

  packages:
    runs-on: ubuntu-latest
    # The apt of Debian 13 installs each package packages.py names.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install --yes --no-install-recommends python3
      - run: sh scripts/infra/packages.sh "$PWD"

  swap:
    runs-on: ubuntu-latest
    # On the runner and not in a container: swapon needs the kernel of a machine. The runner has
    # less swap than memory.
    steps:
      - uses: actions/checkout@v7
      - run: sudo sh scripts/infra/swap.sh "$PWD"

  install:
    runs-on: ubuntu-latest
    # install.py on a Debian 13 booted by systemd-nspawn, with systemd running, and each script on
    # its own machine.
    strategy:
      fail-fast: false
      matrix:
        script: [install.sh, install-logs.sh, deploy.sh, backup.sh, uninstall.sh, java.sh, browser.sh]
    steps:
      - uses: actions/checkout@v7
      # install.py asks for as much swap as memory, and the machine sees those of the runner.
      - run: |
          memory=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          swap=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          if [ "$swap" -lt "$memory" ]; then
            sudo fallocate -l "$((memory - swap + 1024))K" /mnt/swap-ci
            sudo chmod 600 /mnt/swap-ci
            sudo mkswap /mnt/swap-ci
            sudo swapon /mnt/swap-ci
          fi
          sudo modprobe wireguard
      - run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          debootstrap systemd-container debian-archive-keyring
      - run: >-
          sudo debootstrap --variant=minbase
          --include=systemd,systemd-sysv,dbus,sudo,ca-certificates,unattended-upgrades,systemd-timesyncd,openssh-server,postgresql,valkey-server,nftables,procps,python3,wireguard-tools,systemd-journal-remote,iproute2,restic,curl
          trixie /var/lib/machines/machine http://deb.debian.org/debian
      # Caddy comes from its repository, as packages.py installs it: before the machine boots,
      # while it still has the network of the runner.
      - run: >-
          sudo systemd-nspawn --directory=/var/lib/machines/machine --bind-ro="$PWD:/canone"
          python3 /canone/plantilla/infra/packages.py
          ${{ matrix.script == 'browser.sh' && '--browser probe=minutely' || '' }}
          ${{ matrix.script == 'java.sh' && '--java ping' || '' }}
      # java.md: the piece of java.sh, built outside the machine with the JDK of the CI, as
      # release.yml builds it.
      - if: matrix.script == 'java.sh'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - if: matrix.script == 'java.sh'
        run: python3 ../../plantilla/scripts/java.py ping Ping ping/build
        working-directory: scripts/infra
      # The receiver runs rest-server 0.14.0 from its release, the version despliegue.md fixes.
      - if: matrix.script == 'backup.sh'
        run: |
          archive=rest-server_0.14.0_linux_amd64
          curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/restic/rest-server/releases/download/v0.14.0/$archive.tar.gz"
          echo "4c9c95bc079a0334e81fad379b19dc5c3353c71c2c88d652cafce2081c2b1c66  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/$archive/rest-server" /var/lib/machines/machine/usr/local/bin/rest-server
      # The machine has no internet: deploy.py finds each package of the server in the cache of uv,
      # and browser.sh finds Playwright.
      - if: matrix.script == 'deploy.sh' || matrix.script == 'browser.sh'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - if: matrix.script == 'deploy.sh' || matrix.script == 'browser.sh'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: plantilla/server/pyproject.toml
      - if: matrix.script == 'browser.sh'
        run: |
          uv venv "$RUNNER_TEMP/probe"
          UV_CACHE_DIR="$RUNNER_TEMP/uv" uv pip install --python "$RUNNER_TEMP/probe" playwright==1.65.1
          sudo cp -r "$RUNNER_TEMP/uv" /var/lib/machines/machine/var/cache/uv-ci
          sudo install -m 755 "$(command -v uv)" /var/lib/machines/machine/usr/local/bin/uv
      - if: matrix.script == 'deploy.sh'
        run: |
          cp -r plantilla/server "$RUNNER_TEMP/server"
          (cd "$RUNNER_TEMP/server" && UV_CACHE_DIR="$RUNNER_TEMP/uv" uv sync --locked --no-dev)
          sudo cp -r "$RUNNER_TEMP/uv" /var/lib/machines/machine/var/cache/uv-ci
          sudo install -m 755 "$(command -v uv)" /var/lib/machines/machine/usr/local/bin/uv
      # Its own network, for its firewall; and /proc/sys writable, for the sysctl of Valkey.
      - run: >-
          sudo systemd-run --unit=machine --setenv=SYSTEMD_NSPAWN_API_VFS_WRITABLE=1
          systemd-nspawn --boot --machine=machine --directory=/var/lib/machines/machine
          --private-network --capability=all --bind-ro="$PWD:/canone"
      - run: |
          for attempt in $(seq 120); do
            state=$(sudo systemctl --machine=machine is-system-running --wait 2> /dev/null) && break
            if [ "$state" = degraded ]; then sudo systemctl --machine=machine --failed; break; fi
            sleep 1
          done
          echo "$state"
      - run: >-
          sudo systemd-run --machine=machine --wait --pipe --quiet --setenv=UV_CACHE_DIR=/var/cache/uv-ci
          sh /canone/scripts/infra/${{ matrix.script }} /canone
      - if: failure()
        run: sudo journalctl --machine=machine --no-pager --priority=info -n 300

  postgres:
    runs-on: ubuntu-latest
    # The PostgreSQL and PostGIS of Debian 13, with the accounts and roles install.py creates.
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql postgresql-17-postgis-3 python3 systemd
          pg_ctlcluster 17 main status || pg_ctlcluster 17 main start
      - run: |
          mkdir -p /etc/sysusers.d
          sed s/PRODUCTO/app/g plantilla/infra/sysusers.conf > /etc/sysusers.d/app.conf
          systemd-sysusers /etc/sysusers.d/app.conf
          python3 -c 'import sys; sys.path.insert(0, "plantilla/infra"); import install; install.create_database("app", ["postgis"])'
      - run: |
          fails() { if "$@"; then exit 1; fi; }
          query() { runuser -u "$1" -- psql -X -v ON_ERROR_STOP=1 --dbname=app "${@:2}"; }
          # No role is a superuser, and each account logs in only as its role.
          test "$(query postgres -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('app', 'app_owner') AND NOT rolsuper")" = 2
          test "$(query app -Atc "SELECT current_user")" = app
          test "$(query app_owner -Atc "SELECT current_user")" = app_owner
          fails query app --username=app_owner -c "SELECT 1"
          fails query app --host=127.0.0.1 --username=app_owner --no-password -c "SELECT 1"
          # The owner creates tables, and the server only uses what it is granted.
          query app_owner -c "CREATE TABLE place (id int PRIMARY KEY, spot geography(Point, 4326))" -c "GRANT SELECT, INSERT ON place TO app"
          query app -c "INSERT INTO place VALUES (1, ST_MakePoint(-70.6, -33.4))"
          fails query app -c "CREATE TABLE other (id int)"
          # The reader sees what the owner creates, and changes nothing.
          query postgres -c "SET ROLE app_read" -c "SELECT * FROM place"
          fails query postgres -c "SET ROLE app_read" -c "INSERT INTO place VALUES (2, NULL)"
          test "$(query postgres -Atc "SELECT rolsuper FROM pg_roles WHERE rolname = 'app_read'")" = f
          # The text sorts as in Spanish, whatever the locale of the machine.
          test "$(query app -Atc "SELECT datlocprovider::text || ' ' || datlocale FROM pg_database WHERE datname = 'app'")" = "i es"
          test "$(query app -Atc "SELECT string_agg(w, ' ' ORDER BY w) FROM unnest(ARRAY['zeta', 'Ñandú', 'nube', 'Ábaco']) w")" = "Ábaco nube Ñandú zeta"
          # The dump of the unit, restored by the owner on the database install.py creates again.
          set -f
          dump=$(sed -n '/^ExecStart=/{s/^ExecStart=//;s/PRODUCTO/app/g;p}' plantilla/infra/PRODUCTO-dump.service)
          install -d -o app_owner -g app_owner /var/lib/app-dump
          runuser -u app_owner -- $dump
          runuser -u postgres -- dropdb app
          python3 -c 'import sys; sys.path.insert(0, "plantilla/infra"); import install; install.create_database("app", ["postgis"])'
          runuser -u app_owner -- pg_restore --single-transaction --dbname=app /var/lib/app-dump/app.dump
          test "$(query app -Atc "SELECT ST_AsText(spot::geometry) FROM place")" = "POINT(-70.6 -33.4)"

  # The job server of plantilla/.github/workflows/ci.yml, on the server template, without a piece in
  # Java and without geography. The URLs name the roles in lowercase, as PostgreSQL folds them.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plantilla/server
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          folder="$RUNNER_TEMP/credentials"
          mkdir "$folder"
          printf %s postgresql+asyncpg://postgres:postgres@localhost:5432/producto > "$folder/app_database_url"
          printf %s test-health-token > "$folder/app_health_token"
          printf %s "{}" > "$folder/app_min_client_versions"
          printf %s 0FDyrOoVgPY9sMS6gmeGBYIwTWh_I11LIzZMzu4z4wY= > "$folder/app_page_token_key"
          printf %s 3q6Yv1nOQ9i1mXk0jv4XrQ7Wl8l7z3p2c4b5a6d7e8E > "$folder/app_refresh_key"
          printf %s producto.example > "$folder/app_domain"
          printf %s '["android:apk-key-hash:test"]' > "$folder/app_app_origins"
          printf %s valkey://localhost:6379/0 > "$folder/app_valkey_url"
          echo "CREDENTIALS_DIRECTORY=$folder" >> "$GITHUB_ENV"
          cp -r "$folder" "$RUNNER_TEMP/owner"
          printf %s postgresql+asyncpg://producto_owner:owner@localhost:5432/producto > "$RUNNER_TEMP/owner/app_database_url"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: plantilla/server/pyproject.toml
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE PRODUCTO" \
            -c "CREATE ROLE PRODUCTO_owner LOGIN PASSWORD 'owner'" -c "CREATE ROLE PRODUCTO_read" \
            -c "CREATE DATABASE PRODUCTO OWNER PRODUCTO_owner"
          psql postgresql://postgres:postgres@localhost:5432/producto \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE PRODUCTO_owner IN SCHEMA public GRANT SELECT ON TABLES TO PRODUCTO_read"
      - run: uv run python -m app.tasks migrate
        env:
          CREDENTIALS_DIRECTORY: ${{ runner.temp }}/owner
      - run: uv run alembic check
        env:
          CREDENTIALS_DIRECTORY: ${{ runner.temp }}/owner
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
