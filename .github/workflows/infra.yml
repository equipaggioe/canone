name: Infra

on:
  push:
    branches: [master]
    paths: ["plantilla/infra/**", "scripts/infra/**", "fuentes/iana/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["plantilla/infra/**", "scripts/infra/**", "fuentes/iana/**", ".github/workflows/infra.yml"]

jobs:
  exposure:
    runs-on: ubuntu-latest
    # The systemd of Debian 13, where the units run.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install --yes --no-install-recommends systemd
      - run: |
          for unit in plantilla/infra/*.service; do
            systemd-analyze security --offline=yes --threshold=20 "$unit"
          done

  caddy:
    runs-on: ubuntu-latest
    # The Caddy of Debian 13, the one the server installs.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install --yes --no-install-recommends caddy
      # The placeholders take values like those install.py writes.
      - run: |
          mkdir -p "$RUNNER_TEMP/caddy/sites"
          cp plantilla/infra/Caddyfile "$RUNNER_TEMP/caddy/"
          for site in plantilla/infra/PRODUCTO-*.caddy; do
            sed -e s/PRODUCTO/app/g -e s/DOMINIO/example.com/g \
              -e "s/PERMISOS/camera=()/g" "$site" > "$RUNNER_TEMP/caddy/sites/$(basename "$site")"
          done
          caddy validate --config "$RUNNER_TEMP/caddy/Caddyfile"

  sshd:
    runs-on: ubuntu-latest
    # The OpenSSH of Debian 13, which reads the receiver's Match block.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install --yes --no-install-recommends openssh-server
      - run: |
          sed s/PRODUCTO/app/g plantilla/infra/sshd.conf > /etc/ssh/sshd_config.d/00-app.conf
          sed s/PRODUCTO/app/g plantilla/infra/sshd-receiver.conf > /etc/ssh/sshd_config.d/app-receiver.conf
          mkdir -p /run/sshd
          ssh-keygen -A
          sshd -t
      # A provider's file that allows passwords does not win over the template.
      - run: |
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' > /etc/ssh/sshd_config.d/50-cloud-init.conf
          sshd -T > "$RUNNER_TEMP/sshd.txt"
          grep -x "permitrootlogin no" "$RUNNER_TEMP/sshd.txt"
          grep -x "passwordauthentication no" "$RUNNER_TEMP/sshd.txt"
          grep -x "kbdinteractiveauthentication no" "$RUNNER_TEMP/sshd.txt"

  nftables:
    runs-on: ubuntu-latest
    # The nftables of Debian 13, probed from another network namespace.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install --yes --no-install-recommends nftables iproute2 python3
      - run: sh scripts/infra/nftables.sh plantilla/infra/nftables.conf
      - run: sh scripts/infra/nftables.sh plantilla/infra/nftables.conf plantilla/infra/turn.nft

  coturn:
    runs-on: ubuntu-latest
    # The coturn of Debian 13, relaying from another network namespace.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - run: >-
          apt-get update && apt-get install --yes --no-install-recommends
          coturn iproute2 nftables python3
      - run: sh scripts/infra/coturn.sh plantilla/infra/turnserver.conf
      - run: sh scripts/infra/coturn-nat.sh plantilla/infra/turnserver.conf

  logs:
    runs-on: ubuntu-latest
    # The uploader of Debian 13, sending through the tunnel from another network namespace.
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - run: >-
          apt-get update && apt-get install --yes --no-install-recommends
          systemd-journal-remote wireguard-tools iproute2
      - run: sh scripts/infra/logs.sh plantilla/infra/logs.conf plantilla/infra/journal-upload.conf

  install:
    runs-on: ubuntu-latest
    # install.py --logs on a Debian 13 with systemd as PID 1, which a job container does not run.
    steps:
      - uses: actions/checkout@v5
      # install.py asks for as much swap as memory, and the container sees those of the runner.
      - run: |
          memory=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          swap=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          if [ "$swap" -lt "$memory" ]; then
            sudo fallocate -l "$((memory - swap + 1024))K" /mnt/swap-ci
            sudo chmod 600 /mnt/swap-ci
            sudo mkswap /mnt/swap-ci
            sudo swapon /mnt/swap-ci
          fi
          sudo modprobe wireguard
      - run: |
          docker build --tag machine - <<'EOF'
          FROM debian:trixie
          RUN apt-get update && apt-get install --yes --no-install-recommends \
              systemd systemd-sysv sudo unattended-upgrades openssh-server postgresql caddy \
              valkey-server nftables procps python3 wireguard-tools systemd-journal-remote iproute2
          CMD ["/sbin/init"]
          EOF
      - run: >-
          docker run --detach --name machine --privileged --cgroupns=private --env container=docker
          --tmpfs /run --tmpfs /run/lock --volume "$PWD:/canone:ro" machine
      - run: timeout 120 docker exec machine systemctl is-system-running --wait || true
      - run: docker exec machine sh /canone/scripts/infra/install-logs.sh /canone/plantilla/infra/install.py

  postgres:
    runs-on: ubuntu-latest
    # The PostgreSQL and PostGIS of Debian 13, with the accounts and roles install.py creates.
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql postgresql-17-postgis-3 python3 systemd
          pg_ctlcluster 17 main status || pg_ctlcluster 17 main start
      - run: |
          sed s/PRODUCTO/app/g plantilla/infra/sysusers.conf > /etc/sysusers.d/app.conf
          systemd-sysusers /etc/sysusers.d/app.conf
          python3 -c 'import sys; sys.path.insert(0, "plantilla/infra"); import install; install.create_database("app", ["postgis"])'
      - run: |
          fails() { if "$@"; then exit 1; fi; }
          query() { runuser -u "$1" -- psql -X -v ON_ERROR_STOP=1 --dbname=app "${@:2}"; }
          # No role is a superuser, and each account logs in only as its role.
          test "$(query postgres -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('app', 'app_owner') AND NOT rolsuper")" = 2
          test "$(query app -Atc "SELECT current_user")" = app
          test "$(query app_owner -Atc "SELECT current_user")" = app_owner
          fails query app --username=app_owner -c "SELECT 1"
          fails query app --host=127.0.0.1 --username=app_owner --no-password -c "SELECT 1"
          # The owner creates tables, and the server only uses what it is granted.
          query app_owner -c "CREATE TABLE place (id int PRIMARY KEY, spot geography(Point, 4326))" -c "GRANT SELECT, INSERT ON place TO app"
          query app -c "INSERT INTO place VALUES (1, ST_MakePoint(-70.6, -33.4))"
          fails query app -c "CREATE TABLE other (id int)"
          # The dump of the unit, restored by the owner on the database install.py creates again.
          set -f
          dump=$(sed -n '/^ExecStart=/{s/^ExecStart=//;s/PRODUCTO/app/g;p}' plantilla/infra/PRODUCTO-dump.service)
          install -d -o app_owner -g app_owner /var/lib/app-dump
          runuser -u app_owner -- $dump
          runuser -u postgres -- dropdb app
          python3 -c 'import sys; sys.path.insert(0, "plantilla/infra"); import install; install.create_database("app", ["postgis"])'
          runuser -u app_owner -- pg_restore --exit-on-error --dbname=app /var/lib/app-dump/app.dump
          test "$(query app -Atc "SELECT ST_AsText(spot::geometry) FROM place")" = "POINT(-70.6 -33.4)"
