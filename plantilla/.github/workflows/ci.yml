name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ADR-0068: release.yml runs these jobs before building a tag.
  workflow_call:
  # ADR-0019: a vulnerability published after the last commit shows up too.
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  canone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: equipaggioe/canone
          path: .canone
      # transversal.md, «Distribución»: verificar.py checks the RELEASE_ variable of each piece and
      # platform, so a missing one fails instead of leaving the platform out.
      - env:
          VARIABLES: ${{ toJSON(vars) }}
        run: python3 .canone/scripts/verificar.py --repo . --variables "$VARIABLES"

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          folder="$RUNNER_TEMP/credentials"
          mkdir "$folder"
          printf %s postgresql+asyncpg://postgres:postgres@localhost:5432/PRODUCTO > "$folder/app_database_url"
          printf %s test-health-token > "$folder/app_health_token"
          printf %s "{}" > "$folder/app_min_client_versions"
          printf %s 0FDyrOoVgPY9sMS6gmeGBYIwTWh_I11LIzZMzu4z4wY= > "$folder/app_page_token_key"
          printf %s 3q6Yv1nOQ9i1mXk0jv4XrQ7Wl8l7z3p2c4b5a6d7e8E > "$folder/app_refresh_key"
          printf %s producto.example > "$folder/app_domain"
          printf %s '["android:apk-key-hash:test"]' > "$folder/app_app_origins"
          printf %s valkey://localhost:6379/0 > "$folder/app_valkey_url"
          printf %s ayuda@producto.example > "$folder/app_contact"
          printf %s test-equipaggio-key > "$folder/app_equipaggio_key"
          printf %s test-setup-code > "$folder/app_setup_code"
          printf %s "{}" > "$folder/app_firebase_credentials"
          printf %s q83vEjRWeJCrze8SNFZ4kKvN7xI0VniQq83vEjRWeJA > "$folder/app_vapid_key"
          printf %s '{"PRODUCTO-android": "FA+9qCX9VSu"}' > "$folder/app_sms_hashes"
          echo "CREDENTIALS_DIRECTORY=$folder" >> "$GITHUB_ENV"
          # The migrations log in as the owner of the schema, as in production.
          cp -r "$folder" "$RUNNER_TEMP/owner"
          printf %s postgresql+asyncpg://PRODUCTO_owner:owner@localhost:5432/PRODUCTO > "$RUNNER_TEMP/owner/app_database_url"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: server/pyproject.toml
      # Only with a piece in Java: java.py fails on code without its format or with a warning, and
      # the tests that call the piece call it running, which the step of pytest starts (java.md,
      # «Pruebas»).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: python3 scripts/java.py PIEZA_JAVA CLASE PIEZA_JAVA/build
        working-directory: .
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      # The roles and the database install.py creates.
      - run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE PRODUCTO" \
            -c "CREATE ROLE PRODUCTO_owner LOGIN PASSWORD 'owner'" -c "CREATE ROLE PRODUCTO_read" \
            -c "CREATE DATABASE PRODUCTO OWNER PRODUCTO_owner"
          psql postgresql://postgres:postgres@localhost:5432/PRODUCTO \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE PRODUCTO_owner IN SCHEMA public GRANT SELECT ON TABLES TO PRODUCTO_read"
      # Only in a server that stores geography and declares geoalchemy2: without geoalchemy2,
      # alembic check proposes to drop the tables of PostGIS.
      - run: psql postgresql://postgres:postgres@localhost:5432/PRODUCTO -c "CREATE EXTENSION postgis"
      # The migrations and the seeders, as deploy.py runs them.
      - run: uv run python -m app.tasks migrate
        env:
          CREDENTIALS_DIRECTORY: ${{ runner.temp }}/owner
      # A model without its migration fails here.
      - run: uv run alembic check
        env:
          CREDENTIALS_DIRECTORY: ${{ runner.temp }}/owner
      # The pages of the server read the catalogs that release.yml compiles.
      - run: uv run pybabel compile -d src/app/locale
      # A piece in Java runs in the step of pytest, without depending on a process that outlives
      # its step.
      - run: |
          java -jar ../PIEZA_JAVA/build/PIEZA_JAVA/PIEZA_JAVA.jar > "$RUNNER_TEMP/PIEZA_JAVA.log" 2>&1 &
          uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"
      - if: failure()
        run: cat "$RUNNER_TEMP/PIEZA_JAVA.log"

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      # Qt loads libEGL, which the runner image does not have.
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: desktop/pyproject.toml
      - run: uv sync --locked
      # Nuitka compiles src/app/ as it is: the generated models are committed, and must be current.
      - run: uv run datamodel-codegen
      - run: git diff --exit-code src/app/api/models.py
      # Nuitka ships the translations of Qt only with QtWebEngine: qtbase_<locale>.qm goes into
      # resources.qrc with the translations of the app.
      - run: |
          for ts in src/app/translations/*.ts; do
            locale=$(basename "$ts" .ts)
            uv run pyside6-lrelease "$ts" -qm "src/app/translations/$locale.qm"
            uv run python -c "import shutil, sys; from PySide6.QtCore import QLibraryInfo as L; name = sys.argv[1].replace('-', '_'); shutil.copy(f'{L.path(L.LibraryPath.TranslationsPath)}/qtbase_{name}.qm', 'src/app/translations')" "$locale"
          done
          uv run pyside6-rcc src/app/resources.qrc -o src/app/rc_resources.py
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"

  flet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: PIEZA/pyproject.toml
      # The integration tests build the app as a Linux desktop app, which draws on a display.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: uv sync --locked
      - run: >-
          sudo apt-get update && sudo apt-get install -y xvfb
          $(uv run flet --version --json | jq -r '.linux_dependencies | join(" ")')
      # flet build packages src/ as it is: the generated models are committed, and must be current.
      - run: uv run datamodel-codegen
      - run: git diff --exit-code src/api/models.py
      # plataformas/flet.md, «Idiomas»: gettext reads only the .mo, which is not committed.
      - run: uv run pybabel compile -d src/locales -D PIEZA
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      # plataformas/flet.md, «Proyecto»: flet build installs with pip, which does not read uv.lock.
      - run: >-
          uv export --locked --no-dev --no-emit-project --no-emit-local --no-hashes
          --format requirements.txt -o "$RUNNER_TEMP/constraints.txt"
      # flet test builds the integration test app before pytest starts: built inside pytest,
      # flet-cli writes files without an encoding. With the LD_LIBRARY_PATH of setup-python, the
      # Python that the app embeds never starts.
      - run: env -u LD_LIBRARY_PATH xvfb-run uv run flet test
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: PIEZA/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: pnpm
          cache-dependency-path: PIEZA/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm api
      - run: pnpm build
      # plataformas/sveltekit.md, «Proyecto»: after build, which writes the types of .svelte-kit/.
      - run: pnpm exec knip --dependencies
      - run: pnpm exec svelte-check --fail-on-warnings
      - run: pnpm exec vitest run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      - run: dart run dependency_validator
      # plataformas/flutter.md: generated code is not committed, and riverpod_generator ignores page_width.
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart run swagger_parser
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart analyze --fatal-infos
      - run: flutter test

  # Not run yet: check it the first time a repository runs it on GitHub Actions.
  ios:
    if: vars.RELEASE_PIEZA_IOS == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - run: flutter pub get
      - run: dart run swagger_parser
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --no-codesign

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck lint testDebugUnitTest buildHealth
      # plataformas/android.md, «Pruebas»: the managed device needs KVM.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew pixel6DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # An emulator that dies mid-run leaves the task green, with "No test results" in the report.
      - run: "! grep -q testRunFailed app/build/outputs/androidTest-results/managedDevice/debug/pixel6/TEST-pixel6.xml"
