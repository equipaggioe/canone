name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ADR-0068: release.yml runs these jobs before building a tag.
  workflow_call:
  # ADR-0019: a vulnerability published after the last commit shows up too.
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  canone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: OWNER/canone
          path: .canone
      - run: python3 .canone/scripts/verificar.py --repo .

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          folder="$RUNNER_TEMP/credentials"
          mkdir "$folder"
          printf %s postgresql+asyncpg://postgres:postgres@localhost:5432/postgres > "$folder/app_database_url"
          printf %s test-health-token > "$folder/app_health_token"
          printf %s "{}" > "$folder/app_min_client_versions"
          printf %s 0FDyrOoVgPY9sMS6gmeGBYIwTWh_I11LIzZMzu4z4wY= > "$folder/app_page_token_key"
          echo "CREDENTIALS_DIRECTORY=$folder" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      # The role of the server, which the migrations grant.
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE ROLE PRODUCTO"
      - run: uv run alembic upgrade head
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      # Qt loads libEGL, which the runner image does not have.
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"

  flet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyrefly check
      - run: uv run deptry .
      - run: |
          uv export --locked --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - run: uv run pytest
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNDEFAULTENCODING: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: PIEZA/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: PIEZA/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm exec svelte-kit sync
      - run: pnpm exec svelte-check --fail-on-warnings
      - run: pnpm exec vitest run
      - run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck lint testDebugUnitTest
