name: Release

on:
  push:
    tags: ["v*"]

# Only the jobs that publish write: ci.yml inherits these.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  artifact:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: PIEZA/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: PIEZA/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: PIEZA
      - run: pnpm build
        working-directory: PIEZA
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: server/pyproject.toml
      - run: uv run --locked pybabel compile -d src/app/locale
        working-directory: server
      - run: |
          mkdir -p dist/PIEZA
          cp -r PIEZA/build/. dist/PIEZA
          cp -r server scripts dist
          rm -rf dist/server/.venv
          tar -czf "${{ github.event.repository.name }}-$GITHUB_REF_NAME.tar.gz" -C dist .
      # A draft until checksums: a failed job leaves no half release.
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes "${{ github.event.repository.name }}-$GITHUB_REF_NAME.tar.gz"

  desktop:
    needs: artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: bin
            archivo: desktop-linux.bin
          - os: windows-latest
            ext: exe
            archivo: desktop-windows.exe
          - os: macos-latest
            ext: app
            archivo: desktop-macos.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: desktop/pyproject.toml
      - run: uv sync --locked --group deploy
      # pyside6-deploy does not create exec_directory on Linux or Windows.
      - run: mkdir -p dist
      - run: uv run pyside6-deploy -c pysidedeploy.spec --force
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/*.app "${{ matrix.archivo }}"
      - if: runner.os != 'macOS'
        run: mv dist/*.${{ matrix.ext }} "${{ matrix.archivo }}"
      - run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archivo }}"

  # One .sha256 for every file of the release: the signature covers them all.
  checksums:
    needs: [artifact, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SUMS: ${{ github.event.repository.name }}-${{ github.ref_name }}.sha256
    steps:
      - run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
      - run: (cd assets && sha256sum -- *) > "$SUMS"
      - run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$SUMS"
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
