name: Release

on:
  push:
    tags: ["v*"]

# Only the jobs that publish write: ci.yml inherits these.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  artifact:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: PIEZA/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: pnpm
          cache-dependency-path: PIEZA/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: PIEZA
      - run: pnpm build
        working-directory: PIEZA
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: server/pyproject.toml
      - run: uv run --locked pybabel compile -d src/app/locale
        working-directory: server
      # java.md: each piece in Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: python3 scripts/java.py PIEZA_JAVA CLASE dist
      - run: |
          mkdir -p dist/PIEZA
          cp -r PIEZA/build/. dist/PIEZA
          cp -r server dist
          rm -rf dist/server/.venv
          tar -czf "${{ github.event.repository.name }}-$GITHUB_REF_NAME.tar.gz" -C dist .
      # A draft until checksums: a failed job leaves no half release.
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes "${{ github.event.repository.name }}-$GITHUB_REF_NAME.tar.gz"

  # transversal.md, «Distribución»: the desktop systems the repository publishes. ci.yml already
  # failed if a variable is missing.
  systems:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.desktop.outputs.include }}
    steps:
      - id: desktop
        env:
          LINUX: ${{ vars.RELEASE_DESKTOP_LINUX }}
          WINDOWS: ${{ vars.RELEASE_DESKTOP_WINDOWS }}
          MACOS: ${{ vars.RELEASE_DESKTOP_MACOS }}
        run: |
          include='[]'
          add() { include=$(echo "$include" | jq -c --argjson entry "$1" '. + [$entry]'); }
          if [ "$LINUX" = true ]; then add '{"os":"ubuntu-latest","system":"linux","ext":"bin","archivo":"desktop-linux.bin"}'; fi
          if [ "$WINDOWS" = true ]; then add '{"os":"windows-latest","system":"windows","ext":"exe","archivo":"desktop-windows.exe"}'; fi
          if [ "$MACOS" = true ]; then add '{"os":"macos-latest","system":"macos","ext":"app","archivo":"desktop-macos.dmg"}'; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  # Not run yet on macOS: check it the first time a repository publishes there.
  desktop:
    needs: [artifact, systems]
    if: needs.systems.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.systems.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: desktop/pyproject.toml
      # The app installs after rc_resources.py exists: the installation copies src/app/ as it is,
      # and Nuitka compiles that copy.
      - run: uv sync --locked --group deploy --no-install-project
      # Nuitka ships the translations of Qt only with QtWebEngine: qtbase_<locale>.qm goes into
      # resources.qrc with the translations of the app.
      - run: |
          for ts in src/app/translations/*.ts; do
            locale=$(basename "$ts" .ts)
            uv run --no-sync pyside6-lrelease "$ts" -qm "src/app/translations/$locale.qm"
            uv run --no-sync python -c "import shutil, sys; from PySide6.QtCore import QLibraryInfo as L; name = sys.argv[1].replace('-', '_'); shutil.copy(f'{L.path(L.LibraryPath.TranslationsPath)}/qtbase_{name}.qm', 'src/app/translations')" "$locale"
          done
          uv run --no-sync pyside6-rcc src/app/resources.qrc -o src/app/rc_resources.py
      # Installed, not editable: Nuitka finds the package of the distribution in its RECORD.
      - run: uv sync --locked --group deploy --no-editable
      # pyside6-deploy finds the Qt modules the app needs with dumpbin, which is not on the PATH:
      # without it, it only warns and skips them.
      - if: runner.os == 'Windows'
        run: |
          vs=$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)")
          dumpbin=$(find "$vs/VC/Tools/MSVC" -path '*/bin/Hostx64/x64/dumpbin.exe' | head -n1)
          test -n "$dumpbin"
          cygpath -w "$(dirname "$dumpbin")" >> "$GITHUB_PATH"
      # pyside6-deploy does not create exec_directory on Linux or Windows.
      - run: mkdir -p dist
      - run: uv run --no-editable pyside6-deploy -c pysidedeploy.spec --force --no-install
      - if: runner.os != 'macOS'
        run: mv dist/*.${{ matrix.ext }} "${{ matrix.archivo }}"
      # transversal.md, «Distribución»: the .app goes in a DMG signed with Developer ID, notarized
      # and stapled.
      - if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          python3 ../scripts/apple.py keychain
          python3 ../scripts/apple.py dmg dist/*.app "${{ matrix.archivo }}" --sign-app
      - run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archivo }}"

  # transversal.md, «Distribución»: the version goes to the internal track of Play, and the
  # direct download is the universal APK that Play builds from it, as PIEZA.apk.
  # Not run yet: check it the first time a repository runs it on GitHub Actions.
  mobile:
    needs: artifact
    if: vars.RELEASE_PIEZA_ANDROID == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: PIEZA
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: server/pyproject.toml
      - run: flutter pub get
      - run: dart run swagger_parser
      - run: dart run build_runner build --delete-conflicting-outputs
      - env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build appbundle
      - env:
          ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: >-
          printf '%s' "$ACCOUNT" | uv run --script ../scripts/play.py PAQUETE
          build/app/outputs/bundle/release/app-release.aab PIEZA.apk
      - run: gh release upload "$GITHUB_REF_NAME" PIEZA.apk

  # transversal.md, «Distribución»: the iOS version reaches App Store Connect, and stays in
  # TestFlight. plataformas/flutter.md, «Entrega»: Runner signs Release by hand.
  # Not run yet: check it the first time a repository publishes on iOS.
  mobile-ios:
    needs: artifact
    if: vars.RELEASE_PIEZA_IOS == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: dart run swagger_parser
      - run: dart run build_runner build --delete-conflicting-outputs
      - env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_PIEZA }}
        run: |
          python3 ../scripts/apple.py keychain
          python3 ../scripts/apple.py profile
      - run: flutter build ipa --export-options-plist=ios/ExportOptions.plist
      - env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APP_ID: ${{ vars.APPLE_APP_ID_PIEZA }}
        run: python3 ../scripts/apple.py upload build/ios/ipa/*.ipa

  # The same for an app of mobile/ in Kotlin, with its Gradle.
  # Not run yet: check it the first time a repository runs it on GitHub Actions.
  android:
    needs: artifact
    if: vars.RELEASE_MOBILE_ANDROID == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5"
      - uses: gradle/actions/setup-gradle@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: server/pyproject.toml
      - env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - run: ./gradlew bundleRelease
      - env:
          ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: >-
          printf '%s' "$ACCOUNT" | uv run --script ../scripts/play.py PAQUETE
          app/build/outputs/bundle/release/app-release.aab mobile.apk
      - run: gh release upload "$GITHUB_REF_NAME" mobile.apk

  # The same for an app of mobile/ in Flet. flet build reads the upload key from its FLET_ variables.
  # The build and its signature ran on GitHub Actions; the upload to Play and to the release, not yet.
  flet-mobile:
    needs: artifact
    if: vars.RELEASE_PIEZA_ANDROID == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: PIEZA
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: PIEZA/pyproject.toml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: uv sync --locked
      # plataformas/flet.md, «Idiomas»: flet build packages src/ as it is, with the compiled .mo.
      - run: uv run pybabel compile -d src/locales -D PIEZA
      - env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      # plataformas/flet.md, «Proyecto»: flet build installs with pip, which does not read uv.lock.
      - run: >-
          uv export --locked --no-dev --no-emit-project --no-emit-local --no-hashes
          --format requirements.txt -o "$RUNNER_TEMP/constraints.txt"
      - env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/upload.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
        run: uv run flet build aab --yes
      - env:
          ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: >-
          printf '%s' "$ACCOUNT" | uv run --script ../scripts/play.py PAQUETE
          build/aab/*.aab PIEZA.apk
      - run: gh release upload "$GITHUB_REF_NAME" PIEZA.apk

  # The same for iOS. flet build ipa reads the team, the certificate and the profile from
  # [tool.flet.ios]. Not run yet: check it the first time a repository publishes on iOS.
  flet-ios:
    needs: artifact
    if: vars.RELEASE_PIEZA_IOS == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PIEZA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: PIEZA/pyproject.toml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: uv sync --locked
      # plataformas/flet.md, «Idiomas»: flet build packages src/ as it is, with the compiled .mo.
      - run: uv run pybabel compile -d src/locales -D PIEZA
      # plataformas/flet.md, «Proyecto»: flet build installs with pip, which does not read uv.lock.
      - run: >-
          uv export --locked --no-dev --no-emit-project --no-emit-local --no-hashes
          --format requirements.txt -o "$RUNNER_TEMP/constraints.txt"
      - env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_PIEZA }}
        run: |
          python3 ../scripts/apple.py keychain
          python3 ../scripts/apple.py profile
      - env:
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
        run: uv run flet build ipa --yes
      - env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APP_ID: ${{ vars.APPLE_APP_ID_PIEZA }}
        run: python3 ../scripts/apple.py upload build/ipa/*.ipa

  # The installers of an app of desktop/ in Flet: a repository keeps the desktop job of the
  # technology of its desktop/. The Linux and Windows builds ran on GitHub Actions; the upload to
  # the release and macOS, not yet.
  flet-desktop:
    needs: [artifact, systems]
    if: needs.systems.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.systems.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: desktop/pyproject.toml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: uv sync --locked
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          $(uv run flet --version --json | jq -r '.linux_dependencies | join(" ")')
      # plataformas/flet.md, «Idiomas»: flet build packages src/ as it is, with the compiled .mo.
      - run: uv run pybabel compile -d src/locales -D desktop
      # plataformas/flet.md, «Proyecto»: flet build installs with pip, which does not read uv.lock.
      - run: >-
          uv export --locked --no-dev --no-emit-project --no-emit-local --no-hashes
          --format requirements.txt -o "$RUNNER_TEMP/constraints.txt"
      - if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: python3 ../scripts/apple.py keychain
      # plataformas/flet.md, «Entrega»: on macOS, flet build signs, notarizes and staples the app.
      - env:
          PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ "${{ matrix.system }}" = macos ]; then
            printf '%s' "$KEY" > "$APPLE_API_KEY"
            uv run flet build macos --macos-distribution developer-id --yes
          else
            uv run flet build ${{ matrix.system }} --yes
          fi
      # The runner has no FUSE 2, which appimagetool needs. The AppImage keeps the .bin name of
      # install.py: it is an executable like any other.
      - if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: VERSION="${GITHUB_REF_NAME#v}" bash build-appimage.sh && mv build/PIEZA.AppImage "${{ matrix.archivo }}"
      # The Windows runner has Inno Setup 6, with iscc on the PATH.
      - if: runner.os == 'Windows'
        run: iscc installer.iss && mv build/installer/setup.exe "${{ matrix.archivo }}"
      - if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 ../scripts/apple.py dmg build/macos/*.app "${{ matrix.archivo }}"
      - run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archivo }}"

  # One .sha256 for every file of the release: the signature covers them all.
  # A platform the repository does not publish leaves its job skipped, not failed.
  checksums:
    needs: [artifact, desktop, mobile, mobile-ios, android, flet-mobile, flet-ios, flet-desktop]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SUMS: ${{ github.event.repository.name }}-${{ github.ref_name }}.sha256
    steps:
      - run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
      - run: (cd assets && sha256sum -- *) > "$SUMS"
      - run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$SUMS"
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
