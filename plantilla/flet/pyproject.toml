[project]
name = "PRODUCTO-PIEZA"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "flet==1.1.2",
  "flet-secure-storage==1.1.2",
  "httpx==0.28.1",
  "httpx-ws==0.9.0",
  "pydantic==2.13.4",
]

[dependency-groups]
dev = [
  "datamodel-code-generator[ruff]>=0.95.0",
  "flet[cli,test]>=1.1.2",
  "deptry>=0.25.1",
  "pip-audit>=2.10.1",
  "pyrefly>=1.4.0",
  "pytest>=9.2.0",
  "ruff>=0.17.3",
]

[tool.flet]
bundle_id = "DOMINIO-INVERSO.PIEZA"
product = "PRODUCTO"
company = "EMPRESA"
artifact = "PIEZA"
build_number = 1

[tool.flet.app]
path = "src"

[tool.uv]
python-preference = "only-system"
required-version = "==0.13.7"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
  "ASYNC2", "B012", "B904", "D", "DTZ", "E", "F", "G00", "I", "INP", "N", "PGH004", "PT",
  "PYI050", "PYI057", "PYI061", "RET501", "RET502", "RET503", "RUF006", "RUF036", "S306", "S323",
  "S324", "S501", "S503", "S612", "T20", "TID252", "UP006", "UP007", "UP009", "UP013", "UP019",
  "UP035", "UP040", "UP045", "UP046", "W",
]
ignore = ["E722", "N811", "N812", "N813", "N814", "N817", "N818"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# flet build packages src/ itself, so its top-level modules have no package.
"src/*.py" = ["INP001"]
# Generated: the docstrings are the descriptions of the server's schemas.
"src/api/models.py" = ["D1"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["src"]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
missing-override-decorator = false
unannotated-return = "error"

[tool.deptry]
known_first_party = ["api", "colors", "theme", "views"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]
strict = true
filterwarnings = ["error::EncodingWarning", "ignore::EncodingWarning:lazy_loader"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.datamodel-codegen]
input = "../server/openapi.json"
input-file-type = "openapi"
output = "src/api/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.13"
snake-case-field = true
use-annotated = true
use-double-quotes = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
