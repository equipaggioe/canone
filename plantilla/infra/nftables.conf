#!/usr/sbin/nft -f
# ADR-0093: what comes in is denied unless it is listed here; what goes out is allowed.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		# Sources that are never valid off the loopback (NIST SP 800-41, 4.1.1).
		ip saddr { 0.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16 } drop
		ip6 saddr ::1 drop
		# IPv6 needs ICMPv6 to find its neighbors.
		meta l4proto { icmp, ipv6-icmp } accept
		tcp dport { 22, 80, 443 } accept
		# The HTTP/3 of Caddy.
		udp dport 443 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# ADR-0096: the rules a piece the app may not have adds, like turn.nft.
include "/etc/nftables.d/*.nft"
