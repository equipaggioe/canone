#!/usr/sbin/nft -f
# ADR-0093: what comes in is denied unless it is listed here; what goes out is allowed.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		# Sources that are never valid off the loopback (NIST SP 800-41, 4.1.1).
		ip saddr { 0.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16 } drop
		ip6 saddr ::1 drop
		# Nor destinations (NIST SP 800-41, 4.1.1).
		ip daddr { 0.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16 } drop
		ip6 daddr ::1 drop
		# ADR-0210, NIST SP 800-41, 4.1.4: only the ICMP types listed here. Of ICMPv6, what RFC 4890, 4.4.1
		# and 4.4.2, says must not be dropped; of ICMPv4, type 3 and ping, as in IPv6.
		icmp type { destination-unreachable, echo-request } accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
			echo-request, echo-reply, nd-router-solicit, nd-router-advert, nd-neighbor-solicit,
			nd-neighbor-advert, ind-neighbor-solicit, ind-neighbor-advert, mld-listener-query,
			mld-listener-report, mld-listener-done, mld2-listener-report, 148, 149, 151, 152,
			153 } accept
		tcp dport { 22, 80, 443 } accept
		# The HTTP/3 of Caddy.
		udp dport 443 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# ADR-0096: the rules a piece the app may not have adds, like turn.nft.
include "/etc/nftables.d/*.nft"
