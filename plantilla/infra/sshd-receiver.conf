# ADR-0078: the receiver only asks for the backup, through its tunnel.
Match User PRODUCTO-receiver
	AuthorizedKeysFile /etc/PRODUCTO/receivers
	AuthenticationMethods publickey
	ForceCommand /usr/local/lib/PRODUCTO/backup-request
	AllowTcpForwarding remote
	PermitListen 127.0.0.1:8001
	PermitOpen none
	PermitTTY no
	X11Forwarding no
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
