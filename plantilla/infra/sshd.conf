# ADR-0084: ssh only takes keys, and root does not log in. The file sorts before
# the ones of the provider, like 50-cloud-init.conf: sshd keeps the first value.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
# NIST IR 7966, 5.1.2: the keys of an account live in a file of root, which the account cannot
# change.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
# NIST IR 7966, 5.1.1: no forwarding, but the local tunnels of the account that administers, like
# the one to the socket of PostgreSQL. OpenSSH opens one to a socket only if it opens TCP ones too.
AllowTcpForwarding local
AllowAgentForwarding no
X11Forwarding no
AllowStreamLocalForwarding local
# NIST IR 7966, 5.1.1: a session without traffic, or a connection without channels, ends after
# 30 minutes.
ChannelTimeout session=30m
UnusedConnectionTimeout 30m
