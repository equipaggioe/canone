name: passkey
description: The passkeys of the system, Credential Manager on Android and AuthenticationServices on iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: canone.passkey
        pluginClass: PasskeyPlugin
      ios:
        pluginClass: PasskeyPlugin
