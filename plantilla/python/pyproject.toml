[project]
name = "PRODUCTO-PIEZA"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.16",
  "mypy>=2.3",
  "pytest>=9.1",
  "deptry>=0.25",
  "pip-audit>=2.9",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "ASYNC", "TID", "INP", "RUF", "DTZ", "BLE", "S110", "PGH004", "T20", "G", "LOG"]
ignore = ["D1"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]

[tool.mypy]
python_version = "3.13"
strict = true
enable_error_code = ["explicit-override", "ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.uv]
python-preference = "only-system"
