[project]
name = "PRODUCTO-desktop"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pydantic>=2.13",
  "pyside6>=6.11",
]

[dependency-groups]
dev = [
  "deptry>=0.25",
  "mypy>=2.3",
  "pip-audit>=2.10",
  "pytest>=9.1",
  "pytest-qt>=4.5",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
  "ASYNC", "BLE", "D", "DTZ", "E", "E722", "F", "G", "I", "INP", "N", "PGH004", "RUF006",
  "T20", "TID251", "TID252", "UP", "W", "W505",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__feature__".msg = "Qt API keeps its original names"
"httpx".msg = "HTTP goes through QNetworkAccessManager"
"PySide6.QtUiTools".msg = "The interface is built in code"
"requests".msg = "HTTP goes through QNetworkAccessManager"
"urllib.request".msg = "HTTP goes through QNetworkAccessManager"

[tool.mypy]
strict = true
enable_error_code = ["explicit-override", "ignore-without-code"]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
