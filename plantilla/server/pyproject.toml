[project]
name = "PRODUCTO-server"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "alembic>=1.20",
  "asyncpg>=0.31",
  "fastapi[standard]>=0.141",
  "packaging>=26.3",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1",
  "starlette>=1.7",
]

[dependency-groups]
dev = [
  "anyio>=4.15",
  "deptry>=0.25",
  "httpx>=0.28",
  "pip-audit>=2.10",
  "pyrefly>=1.3",
  "pytest>=9.1",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = [
  "ASYNC", "BLE", "D", "DTZ", "E", "E722", "F", "FAST", "G", "I", "INP", "N", "PGH004",
  "RUF006", "T20", "TID252", "UP", "W", "W505",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
missing-override-decorator = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
anyio_mode = "auto"
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# SQLAlchemy loads asyncpg from the database URL.
DEP002 = ["asyncpg"]
