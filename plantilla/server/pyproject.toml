[project]
name = "PRODUCTO-server"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "alembic>=1.20",
  "asyncpg>=0.31",
  "cryptography>=50.0",
  "fastapi[standard]>=0.142",
  "opentelemetry-api>=1.44",
  "opentelemetry-sdk>=1.44",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1",
  "starlette>=1.7",
]

[dependency-groups]
dev = [
  "anyio>=4.15",
  "babel>=2.17",
  "deptry>=0.25",
  "httpx>=0.28",
  "pip-audit>=2.10",
  "pyrefly>=1.3",
  "pytest>=9.1",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = [
  "ASYNC2", "D", "DTZ", "E", "F", "FAST", "G00", "I", "INP", "N", "PGH004", "PT", "PYI050",
  "PYI057", "RUF006", "S306", "S323", "S324", "S501", "S502", "S503", "S612", "T20", "TID251",
  "TID252", "UP006", "UP007", "UP009", "UP013", "UP019", "UP035", "UP040", "UP042", "UP045",
  "UP046", "W",
]
ignore = ["E722", "N811", "N812", "N813", "N814", "N817", "N818"]

[tool.ruff.lint.per-file-ignores]
# An __init__.py would make alembic/ shadow the alembic package.
"alembic/env.py" = ["INP001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.testclient".msg = "Tests are async: use httpx.AsyncClient, and httpx-ws for a WebSocket."
"starlette.testclient".msg = "Tests are async: use httpx.AsyncClient, and httpx-ws for a WebSocket."

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
enabled-ignores = ["pyrefly"]
# models/base.py imports geoalchemy2 only where it is installed.
ignore-missing-imports = ["geoalchemy2", "geoalchemy2.*"]

[tool.pyrefly.errors]
missing-override-decorator = false
unannotated-return = "error"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
strict = true
filterwarnings = ["error::EncodingWarning"]
anyio_mode = "auto"
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# SQLAlchemy loads asyncpg from the database URL.
DEP002 = ["asyncpg"]
# models/base.py imports geoalchemy2 only where it is installed.
DEP001 = ["geoalchemy2"]
