[project]
name = "PRODUCTO-server"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "alembic>=1.20.1",
  "asyncpg>=0.32.0",
  "cryptography>=50.0.2",
  "fastapi>=0.165.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "pillow>=13.0.0",
  "pwdlib[argon2]>=0.4.2",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "sqlalchemy[asyncio]>=2.1.9",
  "starlette>=1.10.0",
  "uvicorn[standard]>=0.54.0",
  "valkey>=6.2.0",
]

[dependency-groups]
dev = [
  "anyio>=4.16.0",
  "babel>=2.18.0",
  "deptry>=0.25.1",
  "httpx>=0.28.1",
  "pip-audit>=2.10.1",
  "pyrefly>=1.5.0",
  "pytest>=9.2.0",
  "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"
required-version = "==0.13.9"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 99
target-version = "py313"
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = [
  "ASYNC2", "B012", "B904", "D", "DTZ", "E401", "E402", "E501", "E711", "E712", "E713", "E714",
  "E721", "E731", "E741", "E742", "E743", "E902", "F", "FAST", "G00", "I", "INP", "N801", "N802",
  "N803", "N804", "N805", "N806", "N807", "N815", "N816", "N999", "PGH004", "PT", "PTH", "PYI050",
  "PYI057", "PYI061", "RET501", "RET502", "RET503", "RUF006", "RUF036", "S306", "S323", "S324",
  "S501", "S503", "S602", "S605", "S612", "T20", "TID251", "TID252", "UP006", "UP007", "UP009",
  "UP013", "UP019", "UP031", "UP032", "UP035", "UP040", "UP042", "UP045", "UP046", "W291", "W293",
  "W505", "W605",
]
ignore = ["D412", "D414", "PTH201", "PTH210"]

[tool.ruff.lint.per-file-ignores]
# An __init__.py would make alembic/ shadow the alembic package.
"alembic/env.py" = ["INP001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.testclient".msg = "Tests are async: use httpx.AsyncClient, and httpx-ws for a WebSocket."
"starlette.testclient".msg = "Tests are async: use httpx.AsyncClient, and httpx-ws for a WebSocket."

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
enabled-ignores = ["pyrefly"]
# models/base.py imports geoalchemy2 only where it is installed.
ignore-missing-imports = ["geoalchemy2", "geoalchemy2.*"]

[tool.pyrefly.errors]
deprecated = "error"
implicit-import = "error"
missing-override-decorator = false
unannotated-return = "error"
unreachable-except-clause = "error"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
anyio_mode = "auto"
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.per_rule_ignores]
# SQLAlchemy loads asyncpg from the database URL, and the unit of the server runs uvicorn.
DEP002 = ["asyncpg", "uvicorn"]
# models/base.py imports geoalchemy2 only where it is installed.
DEP001 = ["geoalchemy2"]
